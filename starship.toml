"$schema" = "https://starship.rs/config-schema.json"

# --------------------------------------------------
# General
# --------------------------------------------------

add_newline = true
command_timeout = 1000
scan_timeout = 100

format = """
[╭─](243)[\\(](243)$os[\\)](243)[─](243)[\\[](243)$directory[\\]](243) \
$git_branch\
$git_status\
$cmd_duration\
$nodejs\
$python\
$rust\
$golang\
$package
[│](243)
[╰─](243)$character"""

# # --------------------------------------------------
# # Fill
# # --------------------------------------------------
#
# [fill]
# symbol = " "

# --------------------------------------------------
# OS
# --------------------------------------------------

[os]
disabled = false
style = "bold blue"
format = "[$symbol ]($style)"

[os.symbols]
Android = ""
Linux = "󰌽"
Ubuntu = "󰕈"
Arch = "󰣇"
Macos = ""

# --------------------------------------------------
# Directory
# --------------------------------------------------

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
read_only = " "
read_only_style = "red"

truncation_length = 2
truncate_to_repo = false
truncation_symbol = ".../"

# --------------------------------------------------
# Git Branch
# --------------------------------------------------

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# --------------------------------------------------
# Git Status
# --------------------------------------------------

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

staged = "+${count} "
modified = "!${count} "
deleted = "✘${count} "
renamed = "»${count} "
untracked = "?${count} "
stashed = "*${count} "
conflicted = "=${count} "

# --------------------------------------------------
# Command Duration
# --------------------------------------------------

[cmd_duration]
min_time = 1000
style = "dimmed white"
format = "[${duration}]($style) "

# --------------------------------------------------
# Package
# --------------------------------------------------

[package]
disabled = false
symbol = "󰏗 "
format = "[$symbol$version](208) "

# --------------------------------------------------
# Node.js
# --------------------------------------------------

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

# --------------------------------------------------
# Python
# --------------------------------------------------

[python]
symbol = " "
python_binary = "python3"
style = "yellow"
format = "[$symbol$version]($style) "

# --------------------------------------------------
# Rust
# --------------------------------------------------

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

# --------------------------------------------------
# Go
# --------------------------------------------------

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

# --------------------------------------------------
# Character
# --------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[󰅙 ❯](bold red)"
vimcmd_symbol = "[NORMAL ❮](bold blue)"
